# Integración continua: en cada push a main y en cada pull request
# compila el backend, corre sus tests, y revisa y compila el frontend.
# Si algo falla, el PR no se puede mergear (con la protección de main activada).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los tests usan Testcontainers: GitHub ya trae Docker instalado
      - name: Compilar y correr los tests
        run: sh ./mvnw -B verify

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (ESLint)
        run: npm run lint

      - name: Compilar
        run: npm run build
